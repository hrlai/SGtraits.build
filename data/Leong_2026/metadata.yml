dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: 2022-06/2023-02
  taxon_name: species
  trait_name: trait_name
  value: value
  location_name: unknown
  individual_id: ID
  description: This dataset was compiled as part of a PhD thesis chapter investigating
    how trait-mediated competition among tropical tree species is shaped by forest
    vertical structure. Leaf and wood economic traits were measured for 20 abundant
    tree species at the Bukit Timah Forest Dynamics Plot in Singapore and integrated
    with long-term forest census data. The central aim was to examine whether the
    same functional trait differences between competing species promote niche differentiation
    or competitive hierarchies depending on where those species sit along the vertical
    gradient, using maximum tree height as an axis of vertical niche and life-history
    strategy.
  basis_of_record: field
  life_stage: adult
  sampling_strategy: Traits were sampled for the 20 most stem-abundant tree species
    at the Bukit Timah Forest Dynamics Plot, collectively representing approximately
    52% of all stems. For each species, 2–5 mature individuals were sampled within
    Bukit Timah Nature Reserve. Individuals were selected to represent typical adult
    size classes, restricted to those with diameter at breast height (DBH) above the
    60th percentile of conspecific DBH within the plot, and individuals showing signs
    of herbivory, disease, or recent physical disturbance were excluded. Sun-exposed
    leaves were collected using a pole pruner (or shaded leaves for known understory
    species), with 5–8 leaves sampled per individual to account for within-crown variation.
    A single branch sample (1.5–4 cm diameter) was collected from individuals (where
    available) for wood density measurements.
  original_file: unknown
  notes: The file leafchem_individual.csv containing data of leaf chemical 
      content includes additional columns H and S which represents hydrogen and 
      sulphur concentrations from the CHNS analysis results. Only S was included
      in the database, as H is not part of the AusTraits list. For SLA and LDMC,
      I used the lamina-only measurements.
