traits:
- var_in: lamina_SLA
  unit_in: cm2/g
  trait_name: leaf_mass_per_area
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5-8 leaves
  methods: Leaves were rehydrated by wrapping leaves with soaked paper towels 
      and left overnight at 4 deg C prior to measurement. For compound leaves, we
      measured individual leaflets, but pooled measurements together to obtain 
      leaf-level data. Rehydrated leaves were flattened and photographed against
      a light box to obtain clear silhouettes, and leaf area was quantified from
      these images using ImageJ. Leaves were then oven-dried at 70 deg C for at least
      1 week until reaching constant mass, and dry mass was recorded to the 
      nearest 0.001 g using an analytical balance. SLA was calculated as fresh 
      leaf area divided by oven-dried leaf mass. For each leaf, we calculated 
      the SLA of just the lamina (lamina_sla), as well as of the full leaf 
      including the petiole (full_sla). Values represent means for each 
      individual across all leaf samples. 
- var_in: lamina_ldmc
  unit_in: mg/g
  trait_name: leaf_dry_matter_content
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 5-8 leaves
  methods: Leaves were rehydrated by wrapping leaves with soaked paper towels
      and left overnight at 4 deg C prior to measurement. For compound leaves, 
      we measured individual leaflets, but pooled measurements together to 
      obtain leaf-level data. Fresh leaf mass after rehydration was recorded
      immediately after removal from rehydration bags. Leaves were then 
      oven-dried at 70°C for at least 1 week until reaching constant mass, 
      and dry mass was recorded to the nearest 0.001 g using an analytical
      balance. LDMC was calculated as oven-dried leaf mass divided by fresh 
      saturated mass. For each leaf, we calculated the LDMC of just the lamina
      (lamina_ldmc), as well as of the full leaf including the petiole 
      (full_ldmc). Values represent means for each individual across all leaf 
      samples. 
- var_in: K
  unit_in: "%"
  trait_name: leaf_K_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dried leaf material was ground to a fine powder using a tissue
      grinder. For each individual, we pooled leaf material (leaf discs punched 
      from each leaf sample) for each individual. Leaf phosphorus [P] and potassium 
      [K] concentrations were determined using ICP-OES following acid digestion. 
      Chemical analyses were conducted by the Elemental Analysis Lab at the National
      University of Singapore. 
- var_in: P
  unit_in: "%"
  trait_name: leaf_P_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: unknown
- var_in: 'N'
  unit_in: "%"
  trait_name: leaf_N_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dried leaf material was ground to a fine powder using a tissue 
      grinder. For each individual, we pooled leaf material (leaf discs punched 
      from each leaf sample) for each individual. Leaf nitrogen concentration 
      [N] was determined using a CHNS analyzer. Chemical analyses were conducted
      by the Elemental Analysis Lab at the National University of Singapore. 
- var_in: C
  unit_in: "%"
  trait_name: leaf_C_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dried leaf material was ground to a fine powder using a tissue 
      grinder. For each individual, we pooled leaf material (leaf discs punched 
      from each leaf sample) for each individual. Leaf nitrogen [N] and carbon
      concentration [C] was determined using a CHNS analyzer. Chemical analyses 
      were conducted by the Elemental Analysis Lab at the National University of
      Singapore. 
- var_in: S
  unit_in: "%"
  trait_name: leaf_S_per_dry_mass
  entity_type: individual
  value_type: raw
  basis_of_value: measurement
  replicates: 1
  methods: Dried leaf material was ground to a fine powder using a tissue 
      grinder. For each individual, we pooled leaf material (leaf discs punched 
      from each leaf sample) for each individual. Leaf sulphur concentration 
      [S] was determined using a CHNS analyzer. Chemical analyses were conducted
      by the Elemental Analysis Lab at the National University of Singapore. 
- var_in: TWD
  unit_in: g/cm3
  trait_name: wood_density
  entity_type: individual
  value_type: mean
  basis_of_value: measurement
  replicates: 1
  methods: Branch segments (1.5–4 cm diameter, 10 cm long) were collected from 
      the outer canopy of each sampled individual. We removed bark and fresh
      volume was determined using the water displacement method. Each twig 
      sample was then split into half and the heartwood of the samples was 
      removed. Samples were oven-dried at 70 deg C for at least 72 hours until 
      reaching constant mass, and dry mass was recorded to the nearest 0.001 g. 
      Wood density was calculated as oven-dried mass divided by fresh volume.
