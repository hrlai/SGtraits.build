traits:
  - var_in: Al_sen
    unit_in: ppm
    trait_name: leaf_senesced_Al_per_dry_mass
    entity_type: species
    value_type: mean
    basis_of_value: measurement
    replicates: 1
    methods:
      For all other biochemical concentrations, two pooled samples for each
      species, one for senesced and one for fresh leaves, were analysed for
      macro- and micronutrients --- phosphorus (P), potassium (K), calcium (Ca),
      iron (Fe), magnesium (Mg), manganese (Mn), aluminium (Al), silicon (Si)
      using inductively coupled plasma - optical emission spectrometry (ICP-OES)
      and high-purity standard references for each element (High-Purity
      Standards, accredited by ANIS National Accreditation Board). Before
      ICP-OES analysis, 50 mg subsamples were digested in mixtures of 1.5 ml
      67-69% nitric acid and 0.25 ml 47=51% hydrofluoric acid in a microwave
      digester at 180 deg C for 1 min to ensure complete digestion (i.e. a clear
      solution obtained) and then topped up with H2O to 10 ml before injection
      into an Avio 500 ICP-OES (PerkinElmer Inc., Waltham, MA, USA).
