  - var_in: dpyr_fre
    unit_in: s
    trait_name: fire_flame_duration
    entity_type: species
    value_type: mean
    basis_of_value: measurement
    replicates: 10 or more
    methods:
      Air-dried senesced and water-saturated fresh leaf samples were burned
      using a controlled experimental setup with a nonflaming epiradiator heat
      source with a diameter 122 mm x 60 mm height x 290 mm length (534 RC 2;
      Quartz Alliance, Villemer, France; Fig. S2). In total, we burned 497 leaf
      samples, which constituted a minimum of 10 replicates per leaf type
      (senesced and live) for each of the 21 species plus some additional burns.
      A square 1.9 x 1.9 cm segment (mean weight +/- SD 0.06 +/- 0.02 g for
      senesced leaves and 3.8 +/- 4.5 g for fresh leaves) was extracted from the
      centre of each leaf that included the midrib. Segments were used as
      opposed to whole leaves, to help standardize the quantity of fuel (plant
      biomass) for each species and speed up the process of burning. In our
      pilot trials, whole leaves took a long time (e.g. up to 30 min) to
      completely burn (data not shown), in line with what was found by Simpson
      et al. (2016) and the segment approach they adopted. Burning took place
      inside a fumehood with a vertical air velocity of 0.51-0.54 m s-1 at c.
      23.6degC ambient temperature. At the start of each burn, the temperature
      of the epiradiator was raised to 400degC, a similar temperature to that
      routinely used in laboratory flammability experiments, for example
      Grootemaat et al. (2015); Simpson et al. (2016); Alam et al. (2019). Above
      the epiradiator was a metal gauze mesh where the leaf subsection was
      placed to burn, surrounded by three K-type thermocouples (5SC-GG-K-30-36;
      Omega Engineering Inc., USA) positioned within 1 cm of the leaf segment
      (Fig. S2). Three thermocouples were connected to a data logger
      (RDXL6S-USB; Omega Engineering Inc., Singapore City, Singapore), and the
      timing upon logging temperature was synchronized with timing of the video
      footage that recorded the burn. All burns were video recorded using a
      digital camera at 30 frames per second (OM-D E-M5 MK III with a 60 mm
      f/2.8 macro lens; Olympus Corp., Tokyo, Japan). The temperature was
      recorded for 2 min before placing the leaf segment on the gauze and for a
      further 6 min after smouldering finished (Fig. S3). On average, an
      experimental burn cycle took 548 +/- 60 s (mean +/- SD; Video S1). The
      majority of burned leaf segments did not produce a flame, and instead, we
      measured pyrolysis (glow) and smouldering (smoke), in an equivalent manner
      to Alessio et al. (2008) and Murray et al. (2013).
