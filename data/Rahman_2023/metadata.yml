  - var_in: C_sen
    unit_in: "%"
    trait_name: leaf_senesced_C_per_dry_mass
    entity_type: species
    value_type: mean
    basis_of_value: measurement
    replicates: 1
    methods:
      Biochemical traits were measured from subsamples of pooled leaf litter and
      oven-dried fresh leaves for each species. Leaves were first homogenized by
      ball grinding (SPEX Sample Prep, Metuchen, NJ, USA) in stainless steel
      containers (Smith et al., 2013). Three randomly selected replicate 2-5 g
      subsamples per species and leaf type (fresh or senesced) were then
      analysed for carbon and nitrogen using a Vario El Cube CHN elemental
      analyser (Elementar, Langenselbold, Germany) using acetanilide (00401-5G;
      Sigma-Aldrich) and mixed spice (MasterFoods, Singapore City, Singapore)
      reference material for C and N concentrations.
  - var_in: N_sen
    unit_in: "%"
    trait_name: leaf_senesced_N_per_dry_mass
    entity_type: species
    value_type: mean
    basis_of_value: measurement
    replicates: 1
    methods:
      Biochemical traits were measured from subsamples of pooled leaf litter and
      oven-dried fresh leaves for each species. Leaves were first homogenized by
      ball grinding (SPEX Sample Prep, Metuchen, NJ, USA) in stainless steel
      containers (Smith et al., 2013). Three randomly selected replicate 2-5 g
      subsamples per species and leaf type (fresh or senesced) were then
