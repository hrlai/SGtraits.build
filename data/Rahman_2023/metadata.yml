dataset:
  data_is_long_format: yes
  custom_R_code: .na
  collection_date: 2020-07/2021-12
  taxon_name: species
  trait_name: trait_name
  value: value
  location_name: unknown
  description:
    Using senesced and fresh leaves of 22 swamp tree species in Singapore, we
    conducted an in situ decomposition experiment and a laboratory flammability
    experiment. We analysed 16 leaf physical and biochemical traits as
    predictors of decomposability and components of flammability ---
    combustibility, ignitability and sustainability.
  basis_of_record: field
  life_stage: adult
  sampling_strategy:
    Leaf material was collected from the Nee Soon freshwater swamp forest,
    Singapore. Leaf litter for decomposition experiments, flammability
    experiments and litter trait measurements was collected between July 2020
    and January 2021 from 10 replicate 400m2 long-term vegetation plots (from a
    total of 40 plots) established in 2013 (described in Chong et al., 2021; Lam
    et al., 2021, 2022). Freshly fallen leaf litter was collected from 1m long x
    1m wide litter traps suspended at least 1m above the ground on a fortnightly
    basis (Lam et al., 2021). Leaf litter was sorted within 24h of collection
    and identified to species from which 21 canopy tree species were selected
    for the present study based on collection of sufficient leaf material for
    filling litterbags. All litter was air-dried at 2decC for 1-8 wk until
    reaching a constant equilibrium weight, which resulted in variable durations
    of drying depending on species leaf litter size, shape and age. Air-dried
    leaf litter was stored in air-tight containers in dry storage for a maximum
    of 6 months before the commencement of decomposition experiments (in
    December 2020) and a maximum of 10 months before flammability experiments
    (in April-June 2021). We also collected fresh leaves for each species for
    flammability experiments and functional leaf trait measurements. Fresh
    leaves were collected in the field from 20 out of 21 species used in the
    decomposition experiment between October and December 2021. Only Alstonia
    pneumatophora Backer ex Den Berger was not collected due to difficulties in
    accessing this rare species in Singapore. Instead, we added Campnosperma
    auriculatum (Blume) Hook.f. in senesced and fresh leaf flammability
    experiments and trait measurements. Leaves were obtained from trees using a
    20-m extension pruner. In the laboratory, fresh leaves were sealed in
    plastic bags at 4degC for 12 h to keep leaves saturated with water before
    flammability experiments and trait measurements.
  original_file: raw/functional_traits_untransformed_decomposition_flammability.csv
  notes:
    I used fresh leaf values for smouldering and flame durations. The authors
    measured them on senesced leaves too, but I had to choose between fresh and
    senesced values as the AusTraits dictionary does not distinguish the two.
    There are also other decomposition and flamability traits worth revisitng.
identifiers: .na
